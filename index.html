<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场部培训系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;max-width:900px;padding:2rem}
.card{background:#fff;border-radius:12px;padding:2rem;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,0.06);transition:box-shadow .2s,transform .2s;text-decoration:none;color:inherit}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,0.1);transform:translateY(-2px)}
.card .icon{font-size:2.5rem;margin-bottom:1rem}
.card h2{font-size:1.2rem;margin-bottom:.5rem;color:#1e3a6f}
.card p{color:#64748b;font-size:.9rem;line-height:1.5}
.footer{text-align:center;color:#94a3b8;margin-top:.5rem;font-size:.85rem;position:fixed;bottom:1.5rem}
</style>
</head>
<body>
<div style="text-align:center;">
<h1 style="font-size:1.6rem;color:#1e3a6f;margin-bottom:2rem;">市场部系统操作培训</h1>
<div class="grid">
  <a href="training/" class="card">
    <div class="icon">📖</div>
    <h2>培训文档</h2>
    <p>联欣与康雷系统操作流程<br>术语表 · 流程图 · 操作对比</p>
  </a>
  <a href="exam/" class="card">
    <div class="icon">📝</div>
    <h2>考核系统</h2>
    <p>实操截图考核<br>答题者上传 · 考核官审核 · 成绩单</p>
  </a>
  <a href="faq/" class="card">
    <div class="icon">💡</div>
    <h2>FAQ 知识库</h2>
    <p>4 部门常见问题速查<br>市场部 · 商品部 · 品牌部 · 财务部</p>
  </a>
</div>
<div class="footer">市场部内部培训系统 · 黄文君</div>
</div>
</body>
</html>
